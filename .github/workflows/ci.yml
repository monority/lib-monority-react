name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Cache pnpm gere nativement par setup-node : remplace le cache
          # manuel ~/.pnpm-store (qui ne coverait pas le virtual store).
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # Les checks de tokens sont deja dans `pnpm test` (task @monority/tokens#test) :
      # build + T1 equivalence, T3 no-hardcoded, T6 deprecated, X2 contrastes,
      # S11 specs, T7 bundle CSS frais, T8 fonds opaques des controles.
      - name: Test
        run: pnpm test

      - name: Format check
        run: pnpm format:check

      # Dette de lint connue et pre-existante (401 diagnostics au moment du
      # cablage, dont 328 sur deux regles de gout : noUnusedTemplateLiteral et
      # useTemplate). Etape non bloquante : elle rend la dette visible et
      # permet de la faire baisser, sans bloquer chaque PR. A passer en
      # bloquante une fois le compteur a zero.
      - name: Lint (non bloquant)
        run: pnpm lint
        continue-on-error: true
