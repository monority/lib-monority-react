name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      # La version de pnpm vient de `packageManager` (package.json) : ne pas
      # ajouter `with.version`, pnpm/action-setup refuse les deux.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Cache pnpm gere nativement par setup-node : remplace le cache
          # manuel ~/.pnpm-store (qui ne coverait pas le virtual store).
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Format check
        run: pnpm format:check

      - name: Lint JS/TS
        run: pnpm lint

      - name: Lint CSS
        run: pnpm lint:css

      - name: Test rendered contrast
        run: pnpm test:rendered

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Test dist package
        run: pnpm --filter @monority/ui test:dist
